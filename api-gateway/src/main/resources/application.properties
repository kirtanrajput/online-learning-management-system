server.port=8080
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Student Service
spring.cloud.gateway.server.webmvc.routes[0].id=student-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/students/**

# Course Service
spring.cloud.gateway.server.webmvc.routes[1].id=course-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/courses/**

# Instructor Service
spring.cloud.gateway.server.webmvc.routes[2].id=instructor-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://INSTRUCTOR-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/instructors/**

# Enrollment Service
spring.cloud.gateway.server.webmvc.routes[3].id=enrollment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ENROLLMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/enrollments/**

# Payment Service
spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/payments/**

# Assignment Service
spring.cloud.gateway.server.webmvc.routes[5].id=assignment-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://ASSIGNMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/assignments/**

# Result Service
spring.cloud.gateway.server.webmvc.routes[6].id=result-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://RESULT-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/results/**